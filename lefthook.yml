pre-commit:
  jobs:
    - name: lint
      stage_fixed: true
      glob: "*.{js,cjs,mjs,jsx,ts,tsx,mts,astro,vue,svelte}"
      run: bun eslint --fix {staged_files}
      exclude:
        - "*.d.ts"
    - name: format
      stage_fixed: true
      glob: "*.{js,cjs,mjs,jsx,ts,mts,tsx,astro,vue,svelte,html,yaml,yml,css,scss,json,jsonc}"
      run: bun prettier --write {staged_files}
